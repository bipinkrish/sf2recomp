# Shadow Fight 2 Recomp settings. Restart the game after editing.
# Add future settings under named sections. Unknown sections/keys are ignored.
# SF2_CONFIG selects a different file; LARECOMP_* environment overrides win.

[general]
# auto = system locale. Examples: en-US, en-GB, ja, fr, de, ru, ko, zh-CN.
language = en-US

[network]
# Keep game networking offline, including DNS, uploads, multiplayer and web links.
# Disabled by default, including older INIs without this section. Restart after editing.
# true permits the original paths; it does not implement online services.
enabled = false

[gameplay]
# Show Normal / LAN Multiplayer when opening Sparring. No external launcher is needed.
allow_sparring_lan_multiplayer = true
# Make every sparring character available regardless of campaign progress.
# false restores normal save-based unlocks. Does not change saved progression.
unlock_all_sparring_characters = true
# Unlock Extras movie playback without changing watched-video save flags.
unlock_all_videos = true
show_intro = true
ai_enabled = true
show_time_results = false

[developer]
# Developer features are opt-in. Set the corresponding option to true to enable.
# F1 or ` opens the original in-game console. Enter: submit; Esc: close;
# Up/Down: command history. devhelp lists trainer/config commands; help lists game commands.
console = false
# Allow the original fight trainer and the local shop cheat panel.
trainer = false
shop_cheats = false
# F2 toggles the original debug overlays. Model/build info appears in supported scenes.
overlays = false
overlays_on_start = false
# Individual overlay choices apply only when overlays is enabled above.
fps = true
memory = true
build_info = true
model_info = true

[audio]
# Master volume, from 0.0 (muted) to 1.0 (full).
volume = 1.0
reverb = true

[video]
# original (16:9), or experimental 16:10, 21:9, 32:9. Restart after changing.
aspect_ratio = original
fullscreen = true
# Guest frame target and virtual display tick, 30-360 Hz (default 60).
# Set the host display to a matching refresh rate separately.
target_fps = 120
# Internal render scale: auto/match follows the window, dynamic adjusts to GPU load,
# or choose a fixed scale (0.25x, 0.50x, 0.75x, 1x, 2x, 3x, 4x).
internal_resolution = auto
# auto chooses bilinear on integrated GPUs and FSR 1 on discrete GPUs.
# FSR 1 runs only when the rendered image is smaller than its window area.
upscaler = auto
# Optional post-process anti-aliasing.
antialiasing = off

[input]
# solo: keyboard + first controller = P1; second controller = P2 (default).
# keyboard_vs_controller: keyboard = P1; first controller = P2.
# two_controllers: controllers = P1/P2; keyboard gameplay input disabled.
# Controllers fill free slots in connection order. Restart after changing.
player_setup = keyboard_vs_controller

[experimental]
# Replace in-game controller icons with mapped keyboard hints. Experimental:
# some screens may need layout adjustments. Off keeps the original game artwork.
keyboard_prompts = false

[storage]
# Relative to the writable data root (normally this converted game's folder).
# Absolute paths and quoted paths with spaces are supported. Values are literal:
# ~, $NAME and %NAME% are not expanded. LARECOMP_SAVE_DIR overrides this at launch.
# Actual game files are stored in save_0/userdata, save_1, etc. beneath this folder.
save_directory = save

[controls.keyboard]
# Left side = Switch input; right side = SDL key/scancode name (case insensitive).
# Use none to unbind. Quote punctuation keys such as ";" or "#".
# Edit this file and restart the game; rebuilding is not required.
a = K
b = J
x = L
y = I
lstick = F
rstick = Keypad 0
l = Q
r = E
zl = 1
zr = 3
plus = Return
minus = Backspace
left = Left
up = Up
right = Right
down = Down
ls_up = W
ls_down = S
ls_left = A
ls_right = D
rs_up = Keypad 8
rs_down = Keypad 5
rs_left = Keypad 4
rs_right = Keypad 6

[controls.gamepad]
# Physical positions, not printed labels: east is Nintendo A / Xbox B / PS Circle.
# Other names include ltrigger/rtrigger, lshoulder/rshoulder and none to unbind.
# Analog sticks keep their normal axes. One host button may drive several inputs.
a = south
b = east
x = west
y = north
lstick = lstick
rstick = rstick
l = lshoulder
r = rshoulder
zl = ltrigger
zr = rtrigger
plus = start
minus = back
left = dpad_left
up = dpad_up
right = dpad_right
down = dpad_down
